name: ci
on:
  pull_request:
  push:
    branches:
      - "master"

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Both ends of the composer.json "php" constraint: the lowest version
        # of each supported range, plus the newest release.
        php-versions: ['7.4', '8.1', '8.6']
    steps:
      - name: Checkout repo
        uses: actions/checkout@v2

      - name: Configure PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-versions }}
          coverage: none

      - name: Lint sources
        run: ./bin/ci_php_lint

  compat:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The lint job only syntax-checks the PHP range; this job executes the
        # test suite on both ends of the composer.json "php" constraint and on
        # the newest release. The extra include pins PHPStan to the lowest
        # release the composer.json constraint allows, so the advertised
        # dependency floor stays tested.
        php-versions: ['7.4', '8.1', '8.6']
        phpstan: ['latest']
        include:
          # The only magento/framework releases that run on PHP 7.4 (102.0.x)
          # depend on composer/composer 1.x, which composer blocks over
          # security advisories; the flag lets this compat leg install it.
          - php-versions: '7.4'
            install-options: '--no-security-blocking'
          # No magento/framework release declares PHP 8.6 support yet; ignore
          # only the upper bound of the platform requirement.
          - php-versions: '8.6'
            install-options: '--ignore-platform-req=php+'
          - php-versions: '8.4'
            phpstan: '2.2.0'
    steps:
      - name: Checkout repo
        uses: actions/checkout@v2

      - name: Configure PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-versions }}
          tools: composer:v2
          coverage: none
          extensions: bcmath, gd

      - name: Install Composer dependencies
        run: composer install ${{ matrix.install-options }}

      - name: Pin PHPStan to the lowest supported release
        if: matrix.phpstan != 'latest'
        run: composer update --with-all-dependencies phpstan/phpstan:${{ matrix.phpstan }}

      - name: Unittests
        run: composer test

  run:
    runs-on: ${{ matrix.operating-system }}
    strategy:
      matrix:
        operating-system: ['ubuntu-latest']
        php-versions: ['8.4']
        magento: ['2.4.8']
        coveralls: [ false ]
        include:
          - php-versions: '8.4'
            magento: '2.4.9'
            operating-system: 'ubuntu-latest'
            coveralls: true
    steps:
      - name: Checkout repo
        uses: actions/checkout@v2

      - name: Configure PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-versions }}
          tools: composer:v2
          coverage: xdebug
          extensions: bcmath, gd

      - name: Install Composer dependencies
        run: composer install

      - name: Install Magento 2.4.8
        if: matrix.magento == '2.4.8'
        run: composer update --with-dependencies magento/framework:103.0.8 laminas/laminas-code:4.17.0 roave/security-advisories symfony/yaml symfony/console madewithlove/license-checker

      - name: Install Magento 2.4.9
        if: matrix.magento == '2.4.9'
        run: composer update --with-dependencies magento/framework:103.0.9 laminas/laminas-code:4.17.0 roave/security-advisories symfony/yaml symfony/console madewithlove/license-checker

      - name: Composer license check
        run: composer check-license

      - name: Codesniffer
        run: composer cs-check

      - name: Neon linting
        run: |
          ./bin/ci_neon_lint
          ./bin/ci_markdown_neon_lint

      - name: Static code analysis
        run: composer analyze

      - name: Static code analysis of the Magento stubs
        run: composer analyze-stubs

      - name: Autoloader smoke test
        env:
          REQUIRE_TURBO: '1'
        run: composer smoke-test

      - name: Unittests
        if: matrix.coveralls == false
        run: composer test

      - name: Unittests with coverage
        if: matrix.coveralls == true
        run: composer coverage

      - name: Coveralls report
        if: matrix.coveralls == true
        env:
          COVERALLS_REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          composer require php-coveralls/php-coveralls
          ./vendor/bin/php-coveralls --coverage_clover=clover.xml -v
